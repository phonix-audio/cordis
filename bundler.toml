# Cargo package name -> the display name a host shows, and the name of the
# bundle directory.
#
# "Cordis" is FROZEN from first publication. With VENDOR it composes the preset
# directory Cubase's MediaBay indexes (`<presets>/Phonix Audio/Cordis/`), and it
# is the bundle name a host resolves when it scans for the plugin. Renaming it
# orphans every `.vstpreset` a user already has. See COMPAT.md.
#
# The vendor is deliberately NOT repeated here: a host prints VENDOR beside the
# name already, so "Phonix Cordis" would only spend list width saying it twice.

[cordis-plugin]
name = "Cordis"
