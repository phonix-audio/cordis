[package]
name = "phonix-data"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Host-agnostic session data model: Session, Track, Pattern, MIDI notes, mod matrix, groove"
keywords = ["audio", "sequencer", "daw", "session", "serde"]
categories = ["multimedia::audio"]
repository = "https://github.com/phonix-audio/phonix-sdk"

[dependencies]
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"
