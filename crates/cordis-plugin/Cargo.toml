[package]
name        = "cordis-plugin"
description = "Cordis — a physically modelled grand piano. VST3 / CLAP."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name       = "cordis_plugin"
crate-type = ["cdylib", "rlib"]

[dependencies]
nice-plug      = { workspace = true }
nice-plug-egui = { workspace = true }
cordis         = { workspace = true }
cordis-ui      = { workspace = true }
egui           = { workspace = true }
serde_json     = { workspace = true }
# The curated master chain. `phonix-fx` is pure DSP: no egui, no
# sequencer, no plugin framework. The engine crate does not see it —
# effects belong to the host, and out here the plugin is the host.
phonix-fx      = { workspace = true }
